<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dirham to Rupee</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef3f1; --surface:#ffffff; --fg:#14231f; --muted:#5d6f69; --line:#d3dfdb;
  --accent:#0d6e57; --accent-soft:#dcefe8; --warm:#b5651d; --bad:#b3261e;
  --display:"Sora",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1715; --surface:#17221f; --fg:#e6efec; --muted:#93a7a0; --line:#2a3a35;
  --accent:#4cc3a0; --accent-soft:#1d3a32; --warm:#e0a060; --bad:#f2847b; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.inrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
.inrow:focus-within{border-color:var(--accent)}
.cur{font-family:var(--display);font-weight:700;color:var(--accent);min-width:2.6em}
.inrow input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-family:var(--mono);font-size:1.6rem;outline:none}
.words{font-size:.85rem;color:var(--warm);min-height:1.2em}
.live{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rate{font-family:var(--mono);font-size:1.05rem}
.status{font-size:.8rem;color:var(--muted)}
.status.err{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--accent)}
.dot.err{background:var(--bad)}
button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font:500 .85rem var(--body);cursor:pointer}
button:hover,button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--fg);font:500 1rem var(--mono)}
.note{font-size:.8rem;color:var(--muted);line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dirham → Rupee</h1>

  <section class="card">
    <div class="live">
      <div>
        <div class="rate" id="rateShow">1 AED = ₹ …</div>
        <div class="status" id="status"><span class="dot" id="dot"></span>Fetching live rate…</div>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </section>

  <section class="card">
    <div class="field">
      <label class="label" for="aed">UAE Dirham</label>
      <div class="inrow"><span class="cur">AED</span><input id="aed" inputmode="decimal" autocomplete="off" value="100"></div>
    </div>
    <div class="field">
      <label class="label" for="inr">Indian Rupee</label>
      <div class="inrow"><span class="cur">₹</span><input id="inr" inputmode="decimal" autocomplete="off"></div>
      <div class="words" id="words"></div>
    </div>
  </section>

  <div class="chips" id="chips"></div>

  <section class="card">
    <div class="settings">
      <div class="field">
        <label class="label" for="override">Manual rate (optional)</label>
        <input id="override" inputmode="decimal" placeholder="use live">
      </div>
      <div class="field">
        <label class="label" for="fee">Card / FX markup %</label>
        <input id="fee" inputmode="decimal" value="0">
      </div>
    </div>
    <p class="note">Live rate is the mid-market AED→INR rate, refreshed when you open the page and every 10 minutes. Your bank or exchange house will quote slightly lower; use markup % to match it.</p>
  </section>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const aed=$("aed"), inr=$("inr"), fee=$("fee"), ov=$("override"), words=$("words");
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  if(store.get("fee")) fee.value=store.get("fee");
  if(store.get("override")) ov.value=store.get("override");

  let live=null, liveTime=null, last="aed";
  const cached=JSON.parse(store.get("liveRate")||"null");
  if(cached){live=cached.rate;liveTime=new Date(cached.time);}

  // Sources tried in order. All are free, keyless and CORS-enabled.
  const SOURCES=[
    {name:"ExchangeRate-API", url:"https://open.er-api.com/v6/latest/AED",
     parse:j=>({rate:j.rates.INR, time:new Date(j.time_last_update_unix*1000)})},
    {name:"currency-api", url:"https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/aed.json",
     parse:j=>({rate:j.aed.inr, time:new Date(j.date)})},
    {name:"currency-api mirror", url:"https://latest.currency-api.pages.dev/v1/currencies/aed.json",
     parse:j=>({rate:j.aed.inr, time:new Date(j.date)})}
  ];

  function setStatus(text,state){
    $("status").className="status"+(state==="err"?" err":"");
    $("status").innerHTML='<span class="dot '+(state||"")+'"></span>'+text;
  }
  async function fetchRate(){
    setStatus("Fetching live rate…");
    for(const s of SOURCES){
      try{
        const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),6000);
        const r=await fetch(s.url+(s.url.includes("?")?"&":"?")+"t="+Date.now(),{signal:ctl.signal,cache:"no-store"});
        clearTimeout(t);
        if(!r.ok) throw new Error(r.status);
        const {rate,time}=s.parse(await r.json());
        if(!(rate>0)) throw new Error("bad rate");
        live=rate; liveTime=time;
        store.set("liveRate",JSON.stringify({rate,time:time.toISOString()}));
        setStatus("Live · "+s.name+" · updated "+time.toLocaleString(),"ok");
        render(); return;
      }catch(e){}
    }
    setStatus(live?"Offline · showing last saved rate from "+liveTime.toLocaleString():"Couldn't reach any rate source. Enter a manual rate.","err");
    render();
  }

  const num=s=>{const n=parseFloat(String(s).replace(/,/g,""));return isFinite(n)?n:NaN};
  function baseRate(){const o=num(ov.value);return o>0?o:live}
  function effRate(){const b=baseRate();if(!(b>0))return NaN;return b*(1+(num(fee.value)||0)/100)}
  const fmtINR=n=>n.toLocaleString("en-IN",{maximumFractionDigits:2,minimumFractionDigits:n%1?2:0});
  const fmtAED=n=>n.toLocaleString("en-US",{maximumFractionDigits:2});
  function inWords(n){
    if(!(n>=1000)) return "";
    if(n>=1e7) return "≈ ₹"+(n/1e7).toFixed(2).replace(/\.?0+$/,"")+" crore";
    if(n>=1e5) return "≈ ₹"+(n/1e5).toFixed(2).replace(/\.?0+$/,"")+" lakh";
    return "≈ ₹"+(n/1e3).toFixed(1).replace(/\.0$/,"")+" thousand";
  }
  function render(){
    const r=effRate();
    $("rateShow").textContent=isNaN(r)?"1 AED = ₹ —":"1 AED = ₹"+r.toFixed(4)+(num(ov.value)>0?" (manual)":(num(fee.value)?" (incl. markup)":""));
    if(last==="aed"){
      const a=num(aed.value);
      if(isNaN(a)||isNaN(r)){inr.value="";words.textContent="";return}
      inr.value=fmtINR(a*r); words.textContent=inWords(a*r);
    }else{
      const i=num(inr.value); words.textContent=isNaN(i)?"":inWords(i);
      aed.value=(isNaN(i)||isNaN(r))?"":fmtAED(i/r);
    }
  }
  aed.addEventListener("input",()=>{last="aed";render()});
  inr.addEventListener("input",()=>{last="inr";render()});
  [fee,ov].forEach(el=>el.addEventListener("input",()=>{store.set(el.id,el.value);render()}));
  $("refresh").addEventListener("click",fetchRate);
  [10,25,50,100,250,500,1000,5000].forEach(v=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=v.toLocaleString("en-US");
    b.addEventListener("click",()=>{aed.value=v;last="aed";render()});$("chips").appendChild(b);
  });
  render(); fetchRate();
  setInterval(fetchRate,10*60*1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)fetchRate()});
})();
</script>
</body>
</html>
